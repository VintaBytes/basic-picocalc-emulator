[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-picocalc-linux"
version = "0.3.10.dev0"
description = "BASIC PicoCalc Emulator: interprete MMBasic independiente y escritorio Linux"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
basic-cde = "basic_cde.__main__:main"
basic-picocalc = "basic_cde.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"basic_cde.devices" = ["font_data/*.h", "font_data/*.rle"]
"basic_cde.gui" = ["assets/*.jpg", "assets/*.png"]
